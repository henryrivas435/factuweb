<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="FactuWeb">
  <!-- Fondo: la tinta del talonario -->
  <rect width="64" height="64" rx="9" fill="#14213D"/>

  <!-- Franja de papel carbon: pocas rayas y gruesas, para que siga
       leyendose cuando el icono se ve a 16 px en la pestana -->
  <g fill="#F2C744">
    <rect x="9"  y="12" width="9" height="4" rx="1"/>
    <rect x="23" y="12" width="9" height="4" rx="1"/>
    <rect x="37" y="12" width="9" height="4" rx="1"/>
    <rect x="51" y="12" width="4" height="4" rx="1"/>
  </g>

  <!-- La F de FactuWeb, con el pie en amarillo como en la marca -->
  <path d="M16 23 H49 V32 H27 V37 H45 V46 H27 V56 H16 Z" fill="#FFFFFF"/>
  <rect x="16" y="46" width="11" height="10" fill="#F2C744"/>
</svg>
