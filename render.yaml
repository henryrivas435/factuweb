# Despliegue en Render (plan gratuito): base PostgreSQL, API y web.
# La base gratuita de Render se borra a los 30 dias.
databases:
  - name: factuweb-base
    plan: free
    databaseName: factuweb
    user: factuweb

services:
  - type: web
    name: factuweb-api
    runtime: docker
    plan: free
    rootDir: factuweb-api
    healthCheckPath: /api/publico/negocios
    envVars:
      # Render conecta la API con la base sola, no hay que copiar nada
      - key: DB_HOST
        fromDatabase:
          name: factuweb-base
          property: host
      - key: DB_PORT
        fromDatabase:
          name: factuweb-base
          property: port
      - key: DB_NAME
        fromDatabase:
          name: factuweb-base
          property: database
      - key: DB_USER
        fromDatabase:
          name: factuweb-base
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: factuweb-base
          property: password
      - key: JWT_SECRET
        generateValue: true
      # El plan gratuito tiene 512 MB: que Java no pida mas memoria de la que hay
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75

  - type: web
    name: factuweb-app
    runtime: docker
    plan: free
    rootDir: factuweb-app
    envVars:
      # URL publica de factuweb-api, sin barra al final. Si Render le pone
      # otro nombre a la API, corregirla en factuweb-app -> Environment.
      - key: API_URL
        value: https://factuweb-api.onrender.com
